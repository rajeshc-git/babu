services:
  # 1. Native Go Microservice Backend (~5MB RAM)
  backend:
    image: ghcr.io/rajeshc-git/babu-backend:latest
    container_name: babu-backend
    restart: unless-stopped
    ports:
      - "8530:8530"
    volumes:
      - ./Assets:/app/Assets:ro
    environment:
      - PORT=8530
      - GITHUB_REPO=rajeshc-git/babu
      - GITHUB_BRANCH=main
    deploy:
      resources:
        limits:
          memory: 48M
          cpus: "0.25"
        reservations:
          memory: 8M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8530/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - babu-net

  # 2. Next.js Clash of Clans Interface (~52MB RAM)
  frontend:
    image: ghcr.io/rajeshc-git/babu-frontend:latest
    container_name: babu-frontend
    restart: unless-stopped
    ports:
      - "1430:1430"
    volumes:
      - ./Assets:/app/Assets:ro
    environment:
      - PORT=1430
      - BACKEND_URL=http://backend:8530
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 160M
          cpus: "0.50"
        reservations:
          memory: 40M
    networks:
      - babu-net

networks:
  babu-net:
    driver: bridge
